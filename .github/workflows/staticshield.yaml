name: 构建 staticshield(HTML加密)_Docker镜像  # ⭐Actions名称,docker

on:  # 定义触发工作流的事件
  # release:  # 当发布新的GitHub release时触发
  #   types: [ published ]  # 当发布新的GitHub release时触发
  workflow_dispatch:  # 手动触发
    # inputs:  # 输入的参数
    #   tag:  # 输入的标签
    #     description: '构建的版本号'  # 手动触发时输入的标签描述
    #     required: true  # 必须输入
    #     default: 'test'  # 默认标签为'test'
  # schedule:  # 定时触发
  #   # 每天 UTC 时间 00:00 运行 (Cron 语法)
  #   - cron: '0 0 * * *'
  # workflow_run:
  #   workflows: ["GoReleaser Workflow"]  # 指定工作流完成时触发
  #   types: [completed]  # 当工作流完成时触发
  # push:
  #   branches: [ "main", "master" ]  # 当指定分支有代码推送时触发
  # pull_request:
  #   branches: [ "main", "master" ]  # 当指定分支有代码拉取请求时触发

permissions:  # 工作流权限
  contents: read  # 工作流需要读取仓库内容的权限
  packages: write  # 工作流需要推送包到 GitHub Container Registry 的权限

# ============================================
# 🔧 ⭐配置区域 - 在这里修改变量即可复用
# ============================================
env:
  # ---------- Git 仓库配置 ----------
  REPO_URL: https://github.com/wangshengithub/staticshield
  REPO_BRANCH:   # 分支或 tag,留空则使用默认分支
  PROJECT_SUBDIR: .  # 项目子目录,留空或使用 . 表示根目录
  # ---------- 镜像配置 ----------
  DOCKERHUB_USERNAME: 918178 # 推送的Docker Hub 用户名(若secrets中有DOCKERHUB_USERNAME则会被覆盖)
  IMAGE_NAME: staticshield  # 镜像名称
  CUSTOM_TAG: latest  # 自定义标签,设为空则使用日期
  EXPORT_TAR: true  # 是否导出tar包(true/false)
  # ---------- 构建配置 ----------
  PLATFORMS: linux/amd64  # 构建平台,多平台用逗号分隔,如：linux/amd64,linux/arm64/v8,linux/arm/v7
  # PLATFORMS: linux/amd64,linux/386,linux/arm64/v8,linux/arm/v7,linux/arm/v6  # 全平台示例
# ============================================

# 可以有多个工作流,多个工作流依次运行
# 一个工作流运行由一个或多个作业组成,这些作业可以顺序或并行运行
jobs:  # 工作流作业
  image:  # 作业名称,唯一标识
    name: 从 Dockerfile 构建映像  # 工作流作业名称
    runs-on: ubuntu-latest  # 在最新的Ubuntu环境中运行
    steps:  # 工作流步骤

      # ========== 代码检出 ==========
      - name: 克隆项目代码
        run: |
          # 从 URL 提取 owner/repo
          REPO_PATH=$(echo "${{ env.REPO_URL }}" | sed -E 's|https?://[^/]+/([^/]+/[^/.]+)(\\.git)?$|\\1|')
          # 留空 REPO_BRANCH 则克隆默认分支;否则按指定分支/tag 克隆
          if [ -n "${{ env.REPO_BRANCH }}" ]; then
            echo "📌 按指定分支/tag 克隆: ${{ env.REPO_BRANCH }}"
            git clone --depth 1 --branch ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} .
          else
            echo "📌 REPO_BRANCH 留空,克隆默认分支"
            git clone --depth 1 ${{ env.REPO_URL }} .
          fi

      # ========== 环境准备 ==========
      # 设置QEMU,用于构建多平台镜像
      - name: 设置 QEMU  # 步骤名称
        uses: docker/setup-qemu-action@v3  # 引用流程

      # 设置Docker Buildx,用于构建和推送多平台镜像
      - name: 设置 Docker Buildx  # 步骤名称
        uses: docker/setup-buildx-action@v3  # 引用流程
        with:  # 参数
          # 使用host网络,避免网络问题
          driver-opts: |
            network=host
          buildkitd-flags: --debug  # 启用调试模式

      # ========== 获取版本信息 ==========
      # 获取当前日期(格式：年月日,如 20251009)
      - name: 获取当前日期
        id: get-date
        run: echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
        shell: bash

      - name: 获取 Git 信息
        id: git-info
        run: |
          # 获取短 SHA
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          # 获取当前分支名
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      # ========== 处理变量 ==========
      # 处理用户名优先级：secrets > env
      - name: 处理用户名
        id: set-username
        run: |
          # 优先使用secrets中的DOCKERHUB_USERNAME
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "DOCKERHUB_USERNAME_FINAL=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_ENV
            echo "✅ 使用 secrets.DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}"
          else
            echo "DOCKERHUB_USERNAME_FINAL=${{ env.DOCKERHUB_USERNAME }}" >> $GITHUB_ENV
            echo "✅ 使用 env.DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}"
          fi

      # 获取镜像标签名称
      - name: 获取 Image Tag  # 步骤名称
        id: set-tag
        run: |
          # 优先级：手动输入 > env.CUSTOM_TAG > 日期
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "📌 使用手动输入标签: ${TAG}"
          elif [ -n "${{ env.CUSTOM_TAG }}" ] && [ "${{ env.CUSTOM_TAG }}" != "latest" ]; then
            TAG="${{ env.CUSTOM_TAG }}"
            echo "📌 使用自定义标签: ${TAG}"
          else
            TAG="${{ steps.get-date.outputs.date }}"
            echo "📌 使用日期标签: ${TAG}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

      # ========== 登录镜像仓库 ==========
      # 登录到 Docker Hub
      - name: 登录 DockerHub  # 步骤名称
        uses: docker/login-action@v3  # 引用流程
        with:
          username: ${{ env.DOCKERHUB_USERNAME_FINAL }}  # Docker Hub 用户名(优先使用secrets)
          password: ${{ secrets.DOCKERHUB_TOKEN }}  # Docker Hub Token(需在secrets中配置)
        continue-on-error: false  # 登录失败时抛出错误

      # 登录到 GitHub Container Registry
      - name: 登录 GitHub Container Registry  # 步骤名称
        uses: docker/login-action@v3  # 引用流程
        with:
          registry: ghcr.io  # GitHub Container Registry 地址
          username: ${{ github.actor }}  # GitHub 用户名(自动获取当前用户)
          password: ${{ secrets.GITHUB_TOKEN }}  # GitHub Token(无需配置,由 GitHub 提供)
        continue-on-error: false  # 登录失败时抛出错误

      # ========== 生成镜像标签 ==========
      # 生成镜像标签
      - name: 生成镜像标签
        id: meta  # 步骤 ID,用于后续引用
        uses: docker/metadata-action@v5
        with:
          # 同时指定Docker Hub和GHCR的镜像名称
          images: |
            ${{ env.DOCKERHUB_USERNAME_FINAL }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # 默认的 latest 标签行为,可由下面的 tags 规则精确控制
          flavor: |
            latest=false
          # 标签规则,根据事件类型和输入参数生成标签
          tags: |
            # 使用环境变量中的标签名称
            type=raw,value=${{ env.TAG_NAME }}
            # # 使用Git提交的短哈希值
            # type=raw,value=${{ steps.git-info.outputs.sha_short }}
            # # 使用分支名称作为标签,启用条件：当前Git引用等于指定的分支名称
            # type=raw,value=${{ steps.git-info.outputs.branch }},enable=${{ github.ref == format('refs/heads/{0}', steps.git-info.outputs.branch) }}
            # 使用 'latest' 作为标签,启用条件：当前事件类型为'release'或'workflow_dispatch'
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}

      # ========== 创建 Dockerfile ==========
      - name: 创建 Dockerfile
        run: |
          # 确定项目路径
          if [ -n "${{ env.PROJECT_SUBDIR }}" ] && [ "${{ env.PROJECT_SUBDIR }}" != "." ]; then
            PROJECT_PATH="${{ env.PROJECT_SUBDIR }}"
          else
            PROJECT_PATH="."
          fi

          cat > Dockerfile << 'EOF'
          # ---------- 阶段 1:构建 GUI 页面 + 容器内注入容器化适配 ----------
          FROM node:18-alpine AS builder

          WORKDIR /build
          COPY ${PROJECT_PATH}/package.json ./
          COPY ${PROJECT_PATH}/encrypt.js ./
          COPY ${PROJECT_PATH}/src/ ./src/
          COPY ${PROJECT_PATH}/gui/ ./gui/

          # 由源码重新生成 gui/index.html（若 src 前端有改动；已存在则覆盖更新）
          RUN node src/build-gui.js || true

          # 在【容器内副本】注入容器化适配（不改动仓库源码）：
          # 1) startServer 支持 SS_HOST / SS_PORT 环境变量覆盖监听地址与端口
          # 2) host 校验放行 SS_HOST 指定的外部地址，使 0.0.0.0 监听可被外部访问
          # 注意：仅修改 /build 内的副本，仓库 src/server.js 保持零改动。
          # 用 Node 做字符串替换，避免 sed 对 &&、[::1]、单引号等特殊字符的转义问题。
          RUN cat > /tmp/patch-server.js <<'PATCH' \
            && node /tmp/patch-server.js \
            && rm /tmp/patch-server.js
          const fs = require('fs');
          const f = '/build/src/server.js';
          let s = fs.readFileSync(f, 'utf8');

          // 1) startServer: 支持 SS_HOST / SS_PORT 环境变量
          s = s.replace(
            "var host = opts.host || '127.0.0.1';",
            "var envHost = process.env.SS_HOST; var envPort = process.env.SS_PORT; var host = opts.host || envHost || '127.0.0.1';"
          );
          s = s.replace(
            "var port = (opts.port === undefined || opts.port === null) ? DEFAULT_PORT : opts.port;",
            "var port = (opts.port !== undefined && opts.port !== null) ? opts.port : (envPort !== undefined && envPort !== null && envPort !== '') ? parseInt(envPort, 10) : DEFAULT_PORT;"
          );

          // 2) host 校验：放行 SS_HOST 指定的外部地址
          s = s.replace(
            "if (host !== '127.0.0.1:' + p && host !== 'localhost:' + p && host !== '[::1]:' + p) return sendJson(res, 403, { ok: false, error: 'Forbidden' });",
            "var allowed = ['127.0.0.1:' + p, 'localhost:' + p, '[::1]:' + p]; if (process.env.SS_HOST) allowed.push(process.env.SS_HOST + ':' + p); if (allowed.indexOf(host) === -1) return sendJson(res, 403, { ok: false, error: 'Forbidden' });"
          );

          if (s.indexOf('SS_HOST') === -1) { console.error('PATCH FAILED: 未匹配到注入点'); process.exit(1); }
          fs.writeFileSync(f, s);
          console.log('PATCH OK: server.js 已注入容器化适配');
          PATCH

          # ---------- 阶段 2:运行镜像 ----------
          FROM node:18-alpine AS runner

          # Node 18 默认不暴露全局 WebCrypto（globalThis.crypto），需开启实验标志
          # 否则运行时报 "Cannot read properties of undefined (reading 'subtle')"
          ENV NODE_OPTIONS=--experimental-global-webcrypto

          # 通过环境变量覆盖 GUI 监听地址与端口，使其对外暴露（容器/代理场景）
          ENV SS_HOST=0.0.0.0
          ENV SS_PORT=8080

          WORKDIR /app

          # 仅从 builder 拷贝运行所需文件（含已注入适配的 server.js），构建中间产物不进入最终镜像
          COPY --from=builder /build/package.json ./
          COPY --from=builder /build/encrypt.js ./
          COPY --from=builder /build/src/ ./src/
          COPY --from=builder /build/gui/ ./gui/

          # 使用非 root 用户运行，降低容器被攻破时的风险
          RUN addgroup -S appgroup && adduser -S appuser -G appgroup && chown -R appuser:appgroup /app
          USER appuser

          # GUI 服务端口
          EXPOSE 8080

          # 默认启动 Web GUI 服务
          # CLI 批量加密用法示例：
          #   docker run --rm -v %cd%/input:/data staticshield:latest node encrypt.js /data/page.html -p YourPwd
          CMD ["node", "encrypt.js", "--gui"]
          EOF

          # 替换变量
          sed -i "s@\${PROJECT_PATH}@${PROJECT_PATH}@g" Dockerfile

          echo "✅ Dockerfile 创建完成："
          cat Dockerfile

          # ========== 创建 .dockerignore ==========
          cat > .dockerignore << 'EOF_DOCKERIGNORE'
          .git
          .gitignore
          node_modules
          *.log
          demo.gif
          demo.png
          video.mp4
          .codebuddy
          README.md
          EOF_DOCKERIGNORE

      # ========== 构建并推送镜像 ==========
      # 构建并推送镜像(可同时推送多个镜像,多个镜像平台)
      - name: 编译并推送 ${{ env.IMAGE_NAME }}镜像  # 步骤名称
        uses: docker/build-push-action@v5  # 引用流程
        with:  # 参数
          context: .  # 构建上下文
          file: ./Dockerfile  # 指定的Dockerfile
          platforms: ${{ env.PLATFORMS }}  # 构建的平台
          push: true  # 推送到仓库
          # load: true  # 加载到本地(多构建平台不支持;若其它也需调用镜像则必须加载,如打包导出)
          # 注意 | 后注释会有问题故放在这
          # 传递构建参数(覆盖 ARG ${{ github.event.repository.name }}_VERSION=3.5.0 配置参数)
          # build-args: |
          #   ${{ github.event.repository.name }}_VERSION=${{ env.TAG_NAME }}
          # 注意 | 后注释会有问题故放在这
          # 推送的镜像标签(版本标签+latest)
          # tags: |  # 使用手动指定标签
          #   ${{ env.TAG }}
          #   ${{ env.TAG_LATEST }}
          tags: ${{ steps.meta.outputs.tags }}  # 使用metadata-action生成的标签
          labels: ${{ steps.meta.outputs.labels }}  # 使用metadata-action生成的标签
          cache-from: type=gha  # 使用GitHub Action缓存
          cache-to: type=gha,mode=max  # 使用GitHub Action缓存

      # ========== 导出 tar 包 ==========
      # 镜像打包为tar包
      - name: 镜像打包为tar包  # 步骤名称
        if: env.EXPORT_TAR == 'true'
        # 注意 | 后注释会有问题故放在这
        # 运行的具体指令,每行指令依次运行
        run: |
          # 获取第一个平台镜像
          FIRST_PLATFORM=$(echo "${{ env.PLATFORMS }}" | cut -d',' -f1)
          docker pull --platform ${FIRST_PLATFORM} ${{ env.DOCKERHUB_USERNAME_FINAL }}/${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}
          docker save -o ${{ env.IMAGE_NAME }}.tar ${{ env.DOCKERHUB_USERNAME_FINAL }}/${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}
          ls -lh ${{ env.IMAGE_NAME }}.tar
          echo "✅ tar 包创建完成"

      # 将构建好的镜像导出为tar包
      - name: Archive 导出内部文件  # 步骤名称
        if: env.EXPORT_TAR == 'true'
        uses: actions/upload-artifact@v4  # 引用流程
        with:  # 参数
          name: ${{ env.IMAGE_NAME }}.tar  # 导出的文件名称
          path: ${{ env.IMAGE_NAME }}.tar  # 导出的文件路径
          retention-days: 1  # 保留 1 天

      # ========== 清理缓存 ==========
      - name: 清理 Docker 缓存
        if: always()
        run: |
          docker builder prune -f
          docker system prune -f --volumes

      # ========== 输出构建信息 ==========
      # 输出构建信息
      - name: 输出构建信息
        run: |
          echo "=========================================="
          echo "✅ 镜像构建并推送成功！"
          echo "=========================================="
          echo "📦 项目: ${{ env.REPO_URL }}"
          echo "🌿 分支: ${{ env.REPO_BRANCH || 'default' }}"
          echo "📂 子目录: ${{ env.PROJECT_SUBDIR }}"
          echo "🏷️  标签: ${{ env.TAG_NAME }}"
          echo "🔢 SHA: ${{ steps.git-info.outputs.sha_short }}"
          echo "🖥️  平台: ${{ env.PLATFORMS }}"
          echo ""
          echo "🐳 Docker Hub:"
          echo "   ${{ env.DOCKERHUB_USERNAME_FINAL }}/${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}"
          echo "   ${{ env.DOCKERHUB_USERNAME_FINAL }}/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "🐙 GitHub Container Registry:"
          echo "   ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}"
          echo "   ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest"
          if [ "${{ env.EXPORT_TAR }}" = "true" ]; then
            echo ""
            echo "📦 tar 包已导出:"
            echo "   ${{ env.IMAGE_NAME }}-${{ env.TAG_NAME }}"
            echo "   ⏱️  保留 1 天"
          fi
          echo "=========================================="
