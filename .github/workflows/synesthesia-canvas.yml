# ==============================================================================
# 工作流名称: 构建 Docker 镜像
#
# 说明:
#   - 本工作流不依赖仓库内预置的 Docker 文件。构建所需文件全部在 Actions 内
#     临时生成 (见 "生成构建文件" 步骤)，构建结束即弃，仓库源码保持干净。
#
# 触发方式:
#   - schedule 定时: 每天 UTC 02:00 自动构建并推送 latest 标签
#   - workflow_dispatch 手动: 手动触发构建并推送
#
# 平台: 默认仅 linux/amd64 (由 env.PLATFORMS 覆盖)。⚠ 勿加 arm64 —— CI 用
#   QEMU 模拟构建 next build 会静默产出损坏的 chunk (文件名 hash 不变但内容坏)。
#
# 推送目标 (固定推 Docker Hub + GHCR, 均打 latest / <package.json version>):
#   - Docker Hub : <DOCKERHUB_USERNAME>/<IMAGE_NAME>   (需 Secrets: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN)
#   - GHCR      : ghcr.io/<运行本 workflow 的仓库 owner>/<IMAGE_NAME>  (用 GITHUB_TOKEN 自动登录)
# ==============================================================================
name: 构建 Synesthesia Canvas(通感画布) 镜像

# ==============================================================================
# 触发条件
# ==============================================================================
on:
  workflow_dispatch:  # 手动触发
  # 定时触发 (如需启用, 取消注释并放到本层级, 与 workflow_dispatch 同级)
  # schedule:
  #   - cron: '0 2 * * *'

# ==============================================================================
# 全局环境变量
# ==============================================================================
env:
  # ⭐目标项目所有者(GitHub用户名)
  UPSTREAM_OWNER: 'hg13128816002-art'
  # ⭐目标项目名称(GitHub仓库名)
  UPSTREAM_REPO: 'Synesthesia-Canvas'
  # ⭐构建的镜像名称(自定义需要构建的镜像名称)
  IMAGE_NAME: 'synesthesia-canvas'
  # ⭐平台列表: 只构建 linux/amd64 (NAS 即 amd64, 原生构建无需 QEMU)。
  #   ⚠ 不要加 linux/arm64: CI runner 是 x86_64, arm64 只能走 QEMU 模拟,
  #   而 QEMU 模拟下 next build 会非确定性地产出损坏 chunk (构建不报错)。
  PLATFORMS: linux/amd64

# ==============================================================================
# 任务定义
# ==============================================================================
jobs:
  build:
    name: 多平台构建并推送
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 检出目标仓库源码 (到 src/ 子目录, 作为构建上下文)
      - name: 克隆上游源码 (main 分支)
        run: |
          rm -rf build-context

          echo "克隆源码: https://github.com/${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }} (branch: main)"
          git clone --depth 1 --branch main --single-branch "https://github.com/${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}.git" build-context

          echo "===== 源码根目录文件: ====="
          ls -la build-context

          # 基本结构校验, 防止上游结构变动导致后续构建静默失败
          if [ ! -f build-context/package.json ]; then
            echo "错误: 未找到 package.json, 源码结构异常!"
            exit 1
          fi

      # 2. 生成构建文件 (临时创建于 build-context/ 内, 不污染源仓库)
      - name: 生成构建文件
        run: |
          set -e
          # 统一使用 build-context/ 作为上下文与生成文件目录

          # 2.1 Dockerfile
          cat > build-context/Dockerfile << 'DOCKEREOF'
          # syntax=docker/dockerfile:1

          # ---------------------------------------------------------------------------
          # Synesthesia Canvas · 多阶段构建 Dockerfile
          # 技术栈：vinext（Vite + Next.js）+ Cloudflare Workers
          # 构建产物为 Cloudflare Worker，容器中以 wrangler dev（miniflare）本地运行。
          # ---------------------------------------------------------------------------

          # ---- 阶段 1：依赖安装 ----
          FROM node:22-bookworm-slim AS deps
          WORKDIR /app

          # 仅复制包清单，充分利用层缓存
          COPY package.json package-lock.json ./
          RUN npm ci

          # ---- 阶段 2：构建 ----
          FROM deps AS build
          WORKDIR /app

          # 复制全部源码与配置文件（含隐藏文件，如 .openai/hosting.json）
          COPY . .

          # 关闭 wrangler 日志写入，避免容器内的文件权限/路径问题
          ENV WRANGLER_LOG_PATH=/tmp/.wrangler/wrangler.log
          ENV MINIFLARE_REGISTRY_PATH=/tmp/.wrangler/registry

          RUN npm run build

          # ---- 阶段 3：运行时 ----
          FROM node:22-bookworm-slim AS runtime
          WORKDIR /app

          ENV NODE_ENV=production
          # 让 wrangler/miniflare 状态写入可写目录
          ENV WRANGLER_LOG_PATH=/tmp/.wrangler/wrangler.log
          ENV MINIFLARE_REGISTRY_PATH=/tmp/.wrangler/registry
          ENV WRANGLER_WRITE_LOGS=false
          # 容器内监听所有网卡，方便外部访问
          ENV HOST=0.0.0.0
          ENV PORT=8787

          # 复制构建阶段的全部产物（含 node_modules，wrangler dev 运行时需要 dev 依赖）
          COPY --from=build /app /app

          # 运行时所需的非特权用户
          RUN groupadd --system --gid 1001 nodejs \
            && useradd --system --uid 1001 --gid nodejs --home /app appuser \
            && mkdir -p /tmp/.wrangler /app/.wrangler \
            && chown -R appuser:nodejs /tmp/.wrangler /app
          USER appuser

          EXPOSE 8787

          # vinext start 内部调用 wrangler dev，-- 后的参数透传给 wrangler，
          # 绑定 0.0.0.0 并指定端口，使容器可被外部访问。
          CMD ["npm", "run", "start", "--", "--ip", "0.0.0.0", "--port", "8787"]
          DOCKEREOF

          echo "=== 已生成构建文件 ==="
          ls -la build-context/Dockerfile

      # (已移除 QEMU 设置步骤: 只构建 amd64, 原生构建无需跨架构模拟)

      # 设置 Docker Buildx
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 Docker Hub (固定推送目标之一)
      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 登录到 GitHub Container Registry (固定推送目标之二)
      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 读取 package.json version (供 version 标签使用)
      - name: 读取版本号
        id: version
        run: |
          VERSION=$(node -p "require('./build-context/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package.json version = $VERSION"

      # 计算小写命名空间 (Docker/OCI 要求仓库名全小写, 而 github.repository_owner 保留原始大小写)
      - name: 计算小写命名空间
        id: names
        run: |
          echo "gh_owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "dh_owner=$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # 10a. 构建并推送 Docker Hub (主推送, 必须成功)
      - name: 构建并推送 Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: build-context
          file: build-context/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          # 关闭 build provenance/attestation: 多平台镜像会额外推送 attestation
          # manifest, 短时间内大量请求易触发注册表二级速率限制
          provenance: false
          # 固定推送 Docker Hub, 标签: latest / <package.json version>
          # 注意: 命名空间必须全小写 (OCI 规范), 故用 steps.names.outputs 的小写值
          tags: |
            ${{ steps.names.outputs.dh_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.names.outputs.dh_owner }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          build-args: |
            SKIP_SW_STAMP=false

      # 10b. 推送 GHCR (与 Docker Hub 分两次调用, 降低单 registry 瞬时请求量;
      #   限流时不影响 Docker Hub 已成功的镜像。失败不阻断 job, 限流窗口过后再重跑即可)
      - name: 推送 GHCR (带重试, 失败不报错)
        continue-on-error: true
        run: |
          set +e
          ok=0
          for i in 1 2 3 4 5; do
            echo "=== GHCR 推送尝试 $i/5 ==="
            if docker buildx build \
              --platform "${{ env.PLATFORMS }}" \
              --tag ghcr.io/${{ steps.names.outputs.gh_owner }}/${{ env.IMAGE_NAME }}:latest \
              --tag ghcr.io/${{ steps.names.outputs.gh_owner }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
              --push \
              build-context; then
              echo "✔ GHCR 推送成功"
              ok=1
              break
            fi
            if [ "$i" -lt 5 ]; then
              WAIT=$((i * 60))
              echo "⚠ GHCR 推送受限, 等待 ${WAIT}s 后重试..."
              sleep "$WAIT"
            else
              echo "✖ GHCR 推送失败 (已重试 5 次), 不阻断 Docker Hub 镜像"
            fi
          done
          # 无论成功失败均以 0 退出, 确保该步骤绝不报错
          exit 0

      # 11. 汇总
      - name: 构建摘要
        run: |
          echo "### 构建完成 🎉" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "源仓库: \`${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "镜像: \`${{ steps.names.outputs.dh_owner }}/${{ env.IMAGE_NAME }}\` 与 \`ghcr.io/${{ steps.names.outputs.gh_owner }}/${{ env.IMAGE_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "平台: \`${{ env.PLATFORMS }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "标签:" >> "$GITHUB_STEP_SUMMARY"
          echo "- :latest / :${{ steps.version.outputs.version }} (Docker Hub + GHCR)" >> "$GITHUB_STEP_SUMMARY"
