# ==============================================================================
# 工作流名称: 构建 animal-world-cup Docker 镜像
#
# 说明:
#   - 本工作流不依赖仓库内预置的 Docker 文件。构建所需三个文件
#     (Dockerfile / .dockerignore / docker/start.mjs) 全部在 Actions 内
#     临时生成 (见 "生成构建文件" 步骤)，构建结束即弃，仓库源码保持干净。
#   - 源码来自另一个仓库 SOURCE_REPO (默认 NeoXu954/animal-world-cup)，
#     checkout 到 src/ 子目录，构建上下文即为 src/。
#   - 构建产物为单镜像。局域网对战依赖 WebSocket relay (script/lan-server.mjs)，
#     由生成的 docker/start.mjs 同时拉起 Web 与 relay。
#   - relay 的对外可达 IP 通过 LAN_PUBLIC_HOST 注入；该值在 CI 中无法确定，
#     故镜像构建期不预设，运行时由部署方用 -e 传入 (未传则回退容器内部 IP)。
#
# 触发方式:
#   - schedule 定时: 每天 UTC 02:00 自动构建并推送 latest 标签
#   - workflow_dispatch 手动: 手动触发构建并推送
#
# 多平台: 默认 linux/amd64,linux/arm64 (由 env.PLATFORMS 覆盖)
#
# 推送目标 (固定推 Docker Hub + GHCR, 均打 latest / <package.json version>):
#   - Docker Hub : <DOCKERHUB_USERNAME>/<IMAGE_NAME>   (需 Secrets: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN)
#   - GHCR      : ghcr.io/<运行本 workflow 的仓库 owner>/<IMAGE_NAME>  (用 GITHUB_TOKEN 自动登录)
#
# 运行时对外地址 (可选, 运行时 -e 传入, 不传则内网裸 IP+端口):
#   仅支持主地址(域名根路径), 不做 /项目名 子路径兼容。
#   - LAN_WS_URL    手机连的 WebSocket 完整地址。
#       例: wss://域名/ws  (nginx 合并端口, WS 挂在 /ws)
#           ws://192.168.1.5:13001  (内网裸部署, 等价默认)
#   - WEB_PUBLIC_URL Web 对外基址(https 主地址), 用于二维码/pad 链接。
#       例: https://域名
#   - LAN_PUBLIC_HOST relay 回退用的对外 IP (无反代时填宿主机 LAN IP)。
#
# 配置方法 (Settings → Secrets and variables → Actions):
#   - Variables (可选):
#       SOURCE_REPO  源仓库, 默认 NeoXu954/animal-world-cup
#       IMAGE_NAME   镜像名, 默认 animal-world-cup
#       PLATFORMS    目标平台, 默认 linux/amd64,linux/arm64
#   - Secrets (推送 Docker Hub 需要):
#       DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
# ==============================================================================
name: 构建 animal-world-cup(动物世界杯) 镜像

# ==============================================================================
# 触发条件
# ==============================================================================
on:
  workflow_dispatch:  # 手动触发
  # 定时触发 (如需启用, 取消注释并放到本层级, 与 workflow_dispatch 同级)
  # schedule:
  #   - cron: '0 2 * * *'

# ==============================================================================
# 全局环境变量
# ==============================================================================
env:
  # ⭐目标项目所有者(GitHub用户名)
  UPSTREAM_OWNER: 'NeoXu954'
  # ⭐目标项目名称(GitHub仓库名)
  UPSTREAM_REPO: 'animal-world-cup'
  # ⭐构建的镜像名称(自定义需要构建的镜像名称)
  IMAGE_NAME: 'animal-world-cup'
  # ⭐多平台列表: buildx 从源码原生构建, 非本机架构用 QEMU 模拟。
  #   要增删平台直接改这一行 (如 'linux/amd64,linux/arm64,linux/arm/v7')。
  PLATFORMS: linux/amd64,linux/arm64
  # ⭐构建开关: 不再在全局写死, 而是由下方矩阵(check 任务生成的 matrix)按变体注入:
  #   BUILD_SERVER  是否内置联机服务器 @noname/server
  #   BUILD_FRONTEND 是否内置前端静态服务 @noname/fs
  #   BUILD_STATIC  是否内置 Web 静态资源(若 false 需运行时 -v 挂载 /app/dist)
  #   各变体组合见 check 任务中的 VARIANTS 定义。

# ==============================================================================
# 任务定义
# ==============================================================================
jobs:
  build:
    name: 多平台构建并推送
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 检出目标仓库源码 (到 src/ 子目录, 作为构建上下文)
      - name: 克隆上游源码 (main 分支)
        run: |
          rm -rf build-context

          echo "克隆源码: https://github.com/${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }} (branch: main)"
          git clone --depth 1 --branch main --single-branch "https://github.com/${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}.git" build-context

          echo "===== 源码根目录文件: ====="
          ls -la build-context

          # 基本结构校验, 防止上游结构变动导致后续构建静默失败
          if [ ! -f build-context/package.json ]; then
            echo "错误: 未找到 package.json, 源码结构异常!"
            exit 1
          fi

      # 2. 生成构建文件 (临时创建于 build-context/ 内, 不污染源仓库)
      - name: 生成构建文件
        run: |
          set -e
          # 统一使用 build-context/ 作为上下文与生成文件目录

          # 2.1 Dockerfile
          cat > build-context/Dockerfile << 'DOCKEREOF'
          # syntax=docker/dockerfile:1
          # ----------------------------------------------------------------------------
          # animal-world-cup — multi-stage Docker build (由 CI 动态生成)
          #
          # 约束:
          #   * 不修改宿主机源码。对源码的"改动"都在镜像副本内完成 (构建期 patch)。
          #   * 局域网对战需要 WebSocket relay (script/lan-server.mjs) 与 Web 同时运行。
          #   * 二维码/房间号由 relay 生成，其对外 IP 通过 LAN_PUBLIC_HOST 注入。
          # ----------------------------------------------------------------------------

          # ---- Stage 1: 依赖安装 -----------------------------------------------------
          FROM node:20-alpine AS deps
          ENV PNPM_HOME=/usr/local/pnpm
          ENV PATH=$PNPM_HOME:$PATH
          # 用 npm 装确定版本 pnpm（避免 corepack prepare 联网下载 shim 失败）
          # 项目 lockfileVersion=9.0，pnpm@9 兼容。
          RUN npm install -g pnpm@9
          WORKDIR /app

          # 仅拷贝依赖清单，利用层缓存。
          # 注意：不拷贝 pnpm-workspace.yaml —— 它只有 allowBuilds/onlyBuiltDependencies、
          # 没有 packages 字段，会被 pnpm 当成 workspace 配置并报
          # "packages field missing or empty"。allow 已写在 package.json 的
          # pnpm.onlyBuiltDependencies 中，无需该文件
          COPY package.json pnpm-lock.yaml ./
          COPY next.config.mjs open-next.config.ts jsconfig.json ./
          RUN --mount=type=cache,target=/usr/local/pnpm/store \
              pnpm install --frozen-lockfile

          # ---- Stage 2: 构建 ---------------------------------------------------------
          FROM deps AS builder
          WORKDIR /app
          COPY . .

          ENV NEXT_TELEMETRY_DISABLED=1
          ENV NODE_ENV=production

          # 整合构建逻辑：等价于 package.json 的 "build"
          #   node script/stamp-sw-version.mjs && node script/safe-build.mjs
          # stamp-sw-version 会改写 public/sw.js —— 只在镜像副本内完成，不污染源码仓库。
          ARG SKIP_SW_STAMP=false
          RUN if [ "$SKIP_SW_STAMP" = "true" ]; then \
                echo "[build] SKIP_SW_STAMP=true, 跳过 sw.js 版本戳"; \
              else \
                node script/stamp-sw-version.mjs; \
              fi
          RUN node script/safe-build.mjs

          # 注：不在构建期 patch 源码。WebSocket 改写、二维码对外地址、relay 对外 IP
          # 全部由运行时的 docker/start.mjs 处理（见下方 start.mjs 说明）。

          # ---- Stage 3: 运行时 -------------------------------------------------------
          FROM node:20-alpine AS runner
          WORKDIR /app
          # 生产
          ENV NODE_ENV=production
          # 禁用遥测
          ENV NEXT_TELEMETRY_DISABLED=1
          # Web服务端口
          ENV WEB_PORT=13000
          # 联机服务端口
          ENV LAN_PORT=13001
          # 启用 LAN 中继
          ENV ENABLE_LAN_RELAY=true

          # 非 root 运行(nodejs)
          RUN addgroup --system --gid 1001 nodejs \
           && adduser  --system --uid 1001 nextjs

          # 从 deps 阶段拷贝完整依赖（含运行时所需的 sharp 等）
          COPY --from=deps --chown=nextjs:nodejs /app/node_modules ./node_modules
          # 构建产物与公共资源
          COPY --from=builder --chown=nextjs:nodejs /app/.next ./.next
          COPY --from=builder --chown=nextjs:nodejs /app/public ./public
          COPY --from=builder --chown=nextjs:nodejs /app/next.config.mjs ./next.config.mjs
          COPY --from=builder --chown=nextjs:nodejs /app/package.json ./package.json
          # 局域网 relay 与容器启动脚本
          COPY --from=builder --chown=nextjs:nodejs /app/script/lan-server.mjs ./script/lan-server.mjs
          COPY --from=builder --chown=nextjs:nodejs /app/docker/start.mjs ./docker/start.mjs
          # 公网对战房间服务 (零依赖 Node 实现)
          COPY --from=builder --chown=nextjs:nodejs /app/online/server.mjs ./online/server.mjs
          COPY --from=builder --chown=nextjs:nodejs /app/online/shared.js ./online/shared.js

          USER nextjs

          EXPOSE 13000 13001 13002

          # 启动命令：由 start.mjs 同时拉起 Web 与 relay，并完成运行时 patch
          CMD ["node", "docker/start.mjs"]
          DOCKEREOF

          # 2.2 .dockerignore (位于构建上下文根, 即 src/)
          cat > build-context/.dockerignore << 'IGNOREEOF'
          node_modules
          .next
          .open-next
          .cloudflare
          .codebuddy
          .git
          .gitignore
          *.log
          npm-debug.log*
          .DS_Store
          IGNOREEOF

          # 2.3 docker/start.mjs (容器启动器, 同时拉起 Web 与 LAN relay)
          #     与仓库 docker/start.mjs 保持一致 (运行时方案，不修改镜像内源码)：
          #       - 生成 public/lan-runtime.js (浏览器 Shim: WebSocket 改写 + 发布
          #         window.__WEB_PUBLIC_URL)，由反向代理 nginx 注入到每个页面 </head> 前
          #       - 正则改写 .next 编译产物 chunk，让二维码/链接优先用 WEB_PUBLIC_URL
          #       - patch relay 副本，让其对公网回报 LAN_PUBLIC_HOST / LAN_PUBLIC_PORT
          mkdir -p build-context/docker
          cat > build-context/docker/start.mjs << 'STARTEOF'
          // =============================================================================
          // 容器入口脚本 (animal-world-cup)
          //
          // 本脚本在容器启动时运行，负责「不修改镜像内源码」地让前端支持：
          //   1) WebSocket (Mixed Content) 修复：把前端的 ws:// 请求改写成 LAN_WS_URL
          //      （HTTPS 反代场景下应为 wss://）。
          //   2) 二维码 / pad 链接使用对外地址 (WEB_PUBLIC_URL)：域名 + HTTPS 场景，
          //      而不是容器内部 IP。
          //   3) 联机 relay 回报对外可达的 host/port (LAN_PUBLIC_HOST / LAN_PUBLIC_PORT)。
          //   4) 公网对战房间服务 (online service)：监听 ONLINE_PORT(默认 13002)，提供
          //      /create (建房 REST) 与 /connect (房间 WebSocket)。原项目公网对战依赖
          //      Cloudflare Worker，这里用 online/server.mjs (零依赖 Node 实现) 自托管。
          //      前端 onlineClient.js 在公网访问时把请求发往 window.location.origin，
          //      所以反代 (nginx) 需把 /create 与 /connect 转发到本服务的 ONLINE_PORT。
          //
          // 设计原则：全部运行时完成，镜像内源码保持原样。
          //   - 浏览器 Shim 写成 public/lan-runtime.js，由「反向代理 (nginx)」注入到
          //     每个页面的 </head> 之前（见 docker/nginx-lan.conf 的 sub_filter）。
          //     之所以放在反代层，是因为 Next.js App Router 的 /lobby 等客户端路由是在
          //     运行时通过 RSC 流式渲染的，.next 里没有对应的静态 .html，容器启动时
          //     无法靠改 HTML 注入脚本；只有反代层能覆盖所有路由。
          //   - 二维码链接的拼接字符串在编译后的 chunk 里（app/lobby/page-*.js），
          //     通过正则改写该 chunk，使其读取 window.__WEB_PUBLIC_URL。
          //
          // 所有行为都由环境变量驱动，全部可选、均有安全默认值：
          //   WEB_PORT           Web 服务端口          默认 13000
          //   LAN_PORT           联机 relay 端口       默认 13001
          //   ENABLE_LAN_RELAY   是否启用 relay        默认 true (设 "false" 关闭)
          //   LAN_WS_URL         前端 WebSocket 目标   默认 ws://<同主机>:LAN_PORT
          //                        HTTPS 反代场景设为 wss://域名:端口/ws
          //   LAN_PUBLIC_HOST    relay 回报的对公网 host（二维码/日志用）
          //                        为空则自动取容器内部 IP（桥接网下手机可能连不到）
          //   LAN_PUBLIC_PORT    relay 回报的对公网 port  默认同 WEB_PORT
          //   WEB_PUBLIC_URL     Web 对外基址（二维码/pad 链接用）
          //                        例如 https://域名:8443；为空则用内部地址
          //   ONLINE_PORT        公网房间服务端口          默认 13002
          //   ENABLE_ONLINE      是否启用公网房间服务       默认 true (设 "false" 关闭)
          //   ALLOWED_ORIGINS    允许跨域的 Origin(逗号分隔) 默认不限制(*)
          //
          // 用法：docker run ... --entrypoint node 镜像 docker/start.mjs
          //       或在 docker-compose 里 entrypoint: ["node","docker/start.mjs"]
          // =============================================================================

          import { spawn } from "node:child_process";
          import { readFile, writeFile, mkdir } from "node:fs/promises";
          import path from "node:path";

          // 应用根目录。Docker 里固定为 /app 且 cwd 是 /app；本地调试可用 APP_DIR 覆盖，
          // 否则回退到当前工作目录。
          const APP_DIR = process.env.APP_DIR || process.cwd();
          const PUBLIC_DIR = path.join(APP_DIR, "public");
          const REPO_RELAY = path.join(APP_DIR, "script", "lan-server.mjs");
          // relay 的运行时 patch 副本（不覆盖原文件，便于排查）
          const PATCHED_RELAY = path.join(APP_DIR, "script", ".lan-server.patched.mjs");

          // ---- 环境变量 --------------------------------------------------------------
          const WEB_PORT = Number(process.env.WEB_PORT || 13000);
          const LAN_PORT = Number(process.env.LAN_PORT || 13001);
          // ENABLE_LAN_RELAY 默认开启；显式设为 "false" 才关闭（web-only 模式）
          const ENABLE_LAN_RELAY = (process.env.ENABLE_LAN_RELAY ?? "true") !== "false";

          // 前端 WebSocket 目标。不设置时默认 ws://<当前访问主机名>:LAN_PORT，
          // 这样「直端口部署（HTTP + IP）」零配置即可工作。
          // HTTPS 反代场景必须设置，例如：LAN_WS_URL=wss://your.domain:8443/ws
          const LAN_WS_URL = (process.env.LAN_WS_URL || "").trim();

          // relay 回报的对公网 host/port。为空则 host 自动取容器内部 IP、port 取 WEB_PORT。
          const LAN_PUBLIC_HOST = (process.env.LAN_PUBLIC_HOST || "").trim();
          const LAN_PUBLIC_PORT = (process.env.LAN_PUBLIC_PORT || "").trim();

          // Web 对外基址（二维码/pad 链接）。为空 => 不设置 window.__WEB_PUBLIC_URL，
          // 前端回退到内部 http://ip:port 默认行为。
          const WEB_PUBLIC_URL = (process.env.WEB_PUBLIC_URL || "").trim();

          // 公网房间服务 (online service)
          const ONLINE_PORT = Number(process.env.ONLINE_PORT || 13002);
          // ENABLE_ONLINE 默认开启；显式设为 "false" 才关闭
          const ENABLE_ONLINE = (process.env.ENABLE_ONLINE ?? "true") !== "false";
          const ONLINE_SERVER = path.join(APP_DIR, "online", "server.mjs");

          // 注：<script src="/lan-runtime.js"> 的注入由反代层 (docker/nginx-lan.conf)
          // 完成，以覆盖运行时渲染的 /lobby 等路由。本脚本只负责「生成」该文件。

          // ---- 1. 生成 public/lan-runtime.js（浏览器运行时 Shim） -------------------
          async function generateRuntime() {
            const wss = LAN_WS_URL || ""; // 空 => 运行时自动用 同主机:LAN_PORT
            const port = LAN_PORT;
            const webPublic = WEB_PUBLIC_URL;
            // Shim 是纯浏览器 IIFE。只内嵌公开的连接提示（JSON 字面量），不含任何密钥。
            const shim = `(function () {
            // ---- WebSocket 改写（修复 Mixed Content）----
            // LAN_WS_URL 未设置时的默认目标：ws://<当前主机>:port
            var WSS = ${JSON.stringify(wss)};
            var PORT = ${JSON.stringify(port)};
            if (!WSS) {
              try { WSS = "ws://" + window.location.hostname + ":" + PORT; } catch (e) { WSS = ""; }
            }
            // 保存原始构造函数，替换全局 WebSocket：遇到非 wss:// 的地址（即明文 ws://
            // 或包含 :port 的地址）都改写为我们的 relay 目标（WSS）。
            var O = window.WebSocket;
            function Patched(u, p) {
              if (typeof u === "string" && u.indexOf("wss://") !== 0) {
                if (u.indexOf("ws://") === 0 || u.indexOf(":" + PORT) !== -1) {
                  u = WSS;
                }
              }
              return new O(u, p);
            }
            Patched.prototype = O.prototype;
            window.WebSocket = Patched;

            // ---- 对外地址（二维码 + pad 链接）----
            // 编译后的 LobbyClient (app/lobby/page-*.js) 已被本脚本的 patchLobbyChunks()
            // 改写为：当 window.__WEB_PUBLIC_URL 存在时优先使用它。这里只需「发布」该值；
            // 为空则保持不设置，前端回退到内部默认地址。
            // 设 WEB_PUBLIC_URL 为例如 https://your.domain:8443 即可让二维码/链接走公网。
            var WEB_PUBLIC = ${JSON.stringify(webPublic)};
            if (WEB_PUBLIC) {
              try { window.__WEB_PUBLIC_URL = WEB_PUBLIC; } catch (e) {}
            }

            console.log("[lan-runtime] WebSocket ->", WSS || ("ws://<host>:" + PORT), "| WEB_PUBLIC_URL =", WEB_PUBLIC || "(internal default)");
          })();
          `;
            await mkdir(PUBLIC_DIR, { recursive: true });
            await writeFile(path.join(PUBLIC_DIR, "lan-runtime.js"), shim, "utf8");
            console.log("[start] wrote public/lan-runtime.js");
            return shim;
          }

          // ---- 2. patch relay 副本（让 relay 回报可配置的公网 host/port） ------------
          async function prepareRelay() {
            if (!ENABLE_LAN_RELAY) return null;
            let src;
            try {
              src = await readFile(REPO_RELAY, "utf8");
            } catch {
              console.log("[start] relay source not found at", REPO_RELAY, "- skipping relay start (web-only mode).");
              return null;
            }

            // 把 `hosted` 消息里的回报地址改成可配置：
            //   ip:   LAN_PUBLIC_HOST 有值 -> 字面量；否则保留 lanIP() 自动获取
            //   port: LAN_PUBLIC_PORT 有值 -> 字面量；否则用 WEB_PORT
            const newIp = LAN_PUBLIC_HOST
              ? JSON.stringify(LAN_PUBLIC_HOST)
              : "lanIP()";
            const newPort = LAN_PUBLIC_PORT ? JSON.stringify(LAN_PUBLIC_PORT) : String(WEB_PORT);

            src = src.replace(
              /send\(ws, \{ t: "hosted", room: code, ip: lanIP\(\), port: 13000, slots: SLOTS \}\);/,
              `send(ws, { t: "hosted", room: code, ip: ${newIp}, port: ${newPort}, slots: SLOTS });`
            );

            await writeFile(PATCHED_RELAY, src, "utf8");
            console.log("[start] relay public host =", LAN_PUBLIC_HOST || "(auto)", "| port =", newPort);
            return PATCHED_RELAY;
          }

          // ---- 2b. patch 编译后的 chunk，让二维码链接优先用 WEB_PUBLIC_URL ----------
          // 预编译的 LobbyClient 把链接写死成 "http://"+msg.ip+":"+msg.port+"/pad?room="+msg.room。
          // 无法改源码，只能运行时改写编译产物。Next 构建产物里实际是 .concat() 形式：
          //   "http://".concat(e.ip,":").concat(e.port,"/pad?room=").concat(e.room)
          // 改写为：window.__WEB_PUBLIC_URL 存在时用它，否则回退原表达式。
          // 属性名 (.ip/.port/.room) 在压缩后保留，故该模式跨构建稳定。
          async function walkJs(dir, out = []) {
            let ents;
            try { ents = await import("node:fs/promises").then((m) => m.readdir(dir, { withFileTypes: true })); }
            catch { return out; }
            for (const e of ents) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) await walkJs(p, out);
              else if (e.name.endsWith(".js")) out.push(p);
            }
            return out;
          }

          async function patchLobbyChunks() {
            const base = path.join(APP_DIR, ".next", "static", "chunks");
            let files = [];
            try { files = await walkJs(base); } catch { return; }
            // 匹配编译产物实际发出的 .concat() 形式（容忍空白）
            const re = /"http:\/\/"\s*\.concat\(\s*([A-Za-z0-9_$]+\.ip)\s*,\s*":"\s*\)\s*\.concat\(\s*([A-Za-z0-9_$]+\.port)\s*,\s*"\/pad\?room="\s*\)\s*\.concat\(\s*([A-Za-z0-9_$]+\.room)\s*\)/g;
            let patched = 0;
            for (const f of files) {
              try {
                const code = await readFile(f, "utf8");
                if (!code.includes("/pad?room=")) continue;
                // 已 patch 过（含 __WEB_PUBLIC_URL 且正则不再匹配）则跳过，避免重复处理
                if (code.includes("__WEB_PUBLIC_URL") && !re.test(code)) continue;
                re.lastIndex = 0;
                if (!re.test(code)) continue;
                re.lastIndex = 0;
                const out = code.replace(re, (m, ip, port, room) =>
                  `(window.__WEB_PUBLIC_URL?window.__WEB_PUBLIC_URL.replace(/\/$/,""):("http://"+((${ip}))+":"+((${port}))))+"/pad?room="+((${room}))`);
                if (out === code) continue;
                await writeFile(f, out, "utf8");
                patched++;
              } catch {}
            }
            if (patched) console.log(`[start] patched ${patched} chunk(s) to honor WEB_PUBLIC_URL`);
            else console.log("[start] NOTE: lobby join-URL chunk not found/patched (WEB_PUBLIC_URL will be ignored by client)");
          }

          // ---- 3. 拉起子进程（Web + relay）-----------------------------------------
          const children = [];
          function run(cmd, args, opts = {}) {
            const c = spawn(cmd, args, { stdio: "inherit", env: process.env, ...opts });
            c.on("exit", (code, sig) => {
              console.log(`[start] ${cmd} ${args.join(" ")} exited (${code ?? sig})`);
              shutdown();
            });
            children.push(c);
            return c;
          }

          let shutting = false;
          function shutdown() {
            if (shutting) return;
            shutting = true;
            for (const c of children) {
              try { c.kill("SIGTERM"); } catch {}
            }
            // 给子进程一点优雅退出时间，超时则强杀
            setTimeout(() => {
              for (const c of children) { try { c.kill("SIGKILL"); } catch {} }
              process.exit(0);
            }, 3000).unref();
          }
          process.on("SIGINT", shutdown);
          process.on("SIGTERM", shutdown);
          process.on("SIGQUIT", shutdown);

          async function main() {
            await generateRuntime();       // 1. 生成浏览器 Shim
            await patchLobbyChunks();      // 2. 改写编译产物 chunk（二维码链接优先用 WEB_PUBLIC_URL）
            const relay = await prepareRelay(); // 3. 生成 patch 后的 relay 副本

            // Web 服务
            run("node", [path.join(APP_DIR, "node_modules", "next", "dist", "bin", "next"), "start", "-p", String(WEB_PORT)], {
              cwd: APP_DIR,
            });

          // 联机 relay
          if (relay) {
            run("node", [relay], { cwd: APP_DIR, env: { ...process.env, LAN_PORT: String(LAN_PORT) } });
          }

          // 公网对战房间服务 (online service, 零依赖 Node 实现)
          if (ENABLE_ONLINE) {
            run("node", [ONLINE_SERVER], {
              cwd: APP_DIR,
              env: { ...process.env, ONLINE_PORT: String(ONLINE_PORT) },
            });
          }

          console.log(`[start] web on :${WEB_PORT}, relay on :${LAN_PORT}, online on :${ENABLE_ONLINE ? ONLINE_PORT : "off"}, LAN relay ${ENABLE_LAN_RELAY ? "on" : "off"}`);
          }

          main().catch((e) => {
            console.error("[start] fatal:", e);
            process.exit(1);
          });
          STARTEOF

          # 2.4 公网对战房间服务 (online service, 零依赖 Node 实现)
          #     原项目公网对战依赖 Cloudflare Worker (Durable Objects)，自托管环境缺失。
          #     这里把 online/server.mjs 与 online/shared.js 写入构建上下文 (上游仓库不含
          #     这两个文件)，由上方 Dockerfile 的 COPY 阶段一并打进镜像。
          #     前端 onlineClient.js 在公网访问时把请求发往 window.location.origin，
          #     在局域网直访问时直连 ws://<host>:13002 (需把 13002 映射到宿主机)。
          mkdir -p build-context/online
          cat > build-context/online/shared.js << 'SHAREDEOF'
          export const ONLINE_MODES = ["direct", "controllers"];

          export const ONLINE_TEAMS = [
            "england",
            "france",
            "germany",
            "spain",
            "portugal",
            "brazil",
            "argentina",
            "usa",
          ];

          export const ONLINE_FORMATIONS = ["2-3-1", "3-2-1", "2-2-2", "3-1-2", "1-3-2", "2-1-3"];
          export const ONLINE_TIMES = [4, 6, 10];
          export const ONLINE_AI_LEVELS = [0, 1, 2];
          export const ONLINE_ROOM_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
          export const ONLINE_ROOM_CODE_LENGTH = 6;
          export const ONLINE_ROOM_TTL_MS = 30 * 60 * 1000;
          export const ONLINE_RECONNECT_GRACE_MS = 30 * 1000;

          function oneOf(value, values, fallback) {
            return values.includes(value) ? value : fallback;
          }

          export function normalizeRoomCode(value) {
            return String(value || "")
              .toUpperCase()
              .replace(/[^A-Z0-9]/g, "")
              .slice(0, ONLINE_ROOM_CODE_LENGTH);
          }

          export function normalizeOnlineConfig(input = {}) {
            const mode = oneOf(input.mode, ONLINE_MODES, "direct");
            const red = oneOf(input.red, ONLINE_TEAMS, "argentina");
            let blue = oneOf(input.blue, ONLINE_TEAMS, "portugal");
            if (blue === red) blue = ONLINE_TEAMS.find((team) => team !== red) || "portugal";

            const formations = input.formations || {};
            return {
              mode,
              red,
              blue,
              side: input.side === "away" ? "away" : "home",
              ai: oneOf(Number(input.ai), ONLINE_AI_LEVELS, 1),
              time: oneOf(Number(input.time), ONLINE_TIMES, 6),
              formations: {
                red: oneOf(formations.red, ONLINE_FORMATIONS, "2-3-1"),
                blue: oneOf(formations.blue, ONLINE_FORMATIONS, "3-2-1"),
              },
            };
          }

          function clampAxis(value) {
            const number = Number(value) || 0;
            return Math.max(-1, Math.min(1, number));
          }

          export function sanitizeOnlineInput(value = {}) {
            return {
              vx: clampAxis(value.vx),
              vy: clampAxis(value.vy),
              shoot: !!value.shoot,
              sprint: !!value.sprint,
              pass: !!value.pass,
              lob: !!value.lob,
              switchPlayer: !!value.switchPlayer,
              tackle: !!value.tackle,
            };
          }

          export function canStartOnlineRoom(config, roster) {
            if (!config || !roster || !roster.screen) return false;
            if (config.mode === "direct") return true;
            return roster.pads.some((pad) => pad.slot === 0) && roster.pads.some((pad) => pad.slot === 1);
          }
          SHAREDEOF

          cat > build-context/online/server.mjs << 'SERVEREOS'
          // =============================================================================
          // 公网对战房间服务 (自托管版, 零外部依赖)
          //
          // 原项目的公网对战后端是一个 Cloudflare Worker (cloudflare/online-worker.js,
          // 基于 Durable Objects)。本文件用纯 Node 标准库等价实现，让自托管 Docker 部署
          // 也能提供 /create (建房 REST) 与 /connect (房间 WebSocket) 两个端点。
          //
          // 协议、房间状态机、角色握手、消息路由均按 online-worker.js 移植；状态用内存
          // Map 存储 (重启即丢, 对休闲对战足够)。
          //
          // 依赖: 仅 node: 内置 (http / crypto)。无需 npm 安装 ws。
          // 启动: node online/server.mjs   端口默认 13002 (ONLINE_PORT 可改)
          //
          // 前端 onlineClient.js 在「公网访问」时 onlineServiceUrl() 返回 window.location
          // .origin，所以请把反代 (nginx) 的 /create 与 /connect 转发到本服务端口。
          // 局域网直访问时 onlineClient.js 直连 ws://<host>:13002 (需映射端口到宿主机)。
          // =============================================================================

          import http from "node:http";
          import crypto from "node:crypto";
          import {
            ONLINE_ROOM_ALPHABET,
            ONLINE_ROOM_CODE_LENGTH,
            ONLINE_ROOM_TTL_MS,
            ONLINE_RECONNECT_GRACE_MS,
            canStartOnlineRoom,
            normalizeOnlineConfig,
            normalizeRoomCode,
            sanitizeOnlineInput,
          } from "./shared.js";

          const PORT = Number(process.env.ONLINE_PORT || 13002);
          const ALLOWED_ORIGINS = String(process.env.ALLOWED_ORIGINS || "")
            .split(",").map((v) => v.trim()).filter(Boolean);
          const MAX_JSON_BYTES = 8 * 1024;
          const MAX_FRAME_BYTES = 64 * 1024;
          const MAX_BUFFERED_BYTES = 512 * 1024;
          const MAX_ROOM_SOCKETS = 8;
          const MAX_MESSAGES_PER_SECOND = 90;

          function randomCode() {
            const bytes = crypto.randomBytes(ONLINE_ROOM_CODE_LENGTH);
            return Array.from(bytes, (v) => ONLINE_ROOM_ALPHABET[v % ONLINE_ROOM_ALPHABET.length]).join("");
          }
          function randomToken() {
            return crypto.randomBytes(18).toString("base64").replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");
          }
          function cors(origin) {
            return {
              "Access-Control-Allow-Origin": origin || "*",
              "Access-Control-Allow-Headers": "content-type",
              "Access-Control-Allow-Methods": "GET,POST,OPTIONS",
              Vary: "Origin",
            };
          }
          function json(body, status = 200, origin = "*") {
            return { status, headers: { "content-type": "application/json; charset=utf-8", ...cors(origin) }, body: JSON.stringify(body) };
          }
          function originAllowed(reqOrigin) {
            return ALLOWED_ORIGINS.length === 0 || ALLOWED_ORIGINS.includes(reqOrigin || "");
          }

          const GUID = "258EAFA5-E914-47DA-95CA-C5AB0DC85B11";

          function acceptWebSocket(req, socket, head, onConnection, onClose) {
            const key = req.headers["sec-websocket-key"];
            if (!key) { socket.destroy(); return; }
            const accept = crypto.createHash("sha1").update(key + GUID).digest("base64");
            socket.write(
              "HTTP/1.1 101 Switching Protocols\r\n" +
              "Upgrade: websocket\r\n" +
              "Connection: Upgrade\r\n" +
              `Sec-WebSocket-Accept: ${accept}\r\n\r\n`
            );
            const ws = new WsConn(socket, onClose);
            onConnection(ws);
          }

          class WsConn {
            constructor(socket, onClose) {
              this.socket = socket;
              this.readyState = 0;
              this.bufferedAmount = 0;
              this._frags = [];
              this._fragOp = 0;
              this._closed = false;
              socket.on("data", (buf) => this._onData(buf));
              socket.on("close", () => { this.readyState = 3; this._closed = true; onClose && onClose(this); });
              socket.on("error", () => { if (!this._closed) { this.readyState = 3; this._closed = true; onClose && onClose(this); } });
              this.readyState = 1;
              this.onmessage = null;
              this.onclose = null;
            }
            _onData(buf) {
              let offset = 0;
              while (offset < buf.length) {
                if (buf.length - offset < 2) { this._buffer = buf.slice(offset); return; }
                const b0 = buf[offset];
                const b1 = buf[offset + 1];
                const fin = (b0 & 0x80) !== 0;
                const opcode = b0 & 0x0f;
                const masked = (b1 & 0x80) !== 0;
                let len = b1 & 0x7f;
                let p = offset + 2;
                if (len === 126) { if (buf.length - p < 2) return; len = buf.readUInt16BE(p); p += 2; }
                else if (len === 127) { if (buf.length - p < 8) return; len = Number(buf.readBigUInt64BE(p)); p += 8; }
                let maskKey;
                if (masked) { if (buf.length - p < 4) return; maskKey = buf.slice(p, p + 4); p += 4; }
                if (buf.length - p < len) return;
                let payload = buf.slice(p, p + len);
                if (masked) {
                  const out = Buffer.allocUnsafe(len);
                  for (let i = 0; i < len; i++) out[i] = payload[i] ^ maskKey[i & 3];
                  payload = out;
                }
                offset = p + len;

                if (opcode === 0x8) { this.close(); return; }
                if (opcode === 0x9) { this._send(0xA, payload); continue; }
                if (opcode === 0xA) continue;
                if (opcode === 0x1 || opcode === 0x2) {
                  if (!fin) { this._frags.push(payload); this._fragOp = opcode; continue; }
                  const data = opcode === 0x1 ? payload.toString("utf8") : payload;
                  this.onmessage && this.onmessage(data);
                } else if (opcode === 0x0) {
                  this._frags.push(payload);
                  if (fin) {
                    const full = Buffer.concat(this._frags);
                    this._frags = [];
                    const data = this._fragOp === 0x1 ? full.toString("utf8") : full;
                    this.onmessage && this.onmessage(data);
                  }
                }
              }
            }
            _send(opcode, data) {
              if (this.readyState !== 1) return;
              const buf = Buffer.isBuffer(data) ? data : Buffer.from(data, "utf8");
              const len = buf.length;
              let header;
              if (len < 126) { header = Buffer.from([0x80 | opcode, len]); }
              else if (len < 65536) { header = Buffer.allocUnsafe(4); header[0] = 0x80 | opcode; header[1] = 126; header.writeUInt16BE(len, 2); }
              else { header = Buffer.allocUnsafe(10); header[0] = 0x80 | opcode; header[1] = 127; header.writeBigUInt64BE(BigInt(len), 2); }
              try { this.socket.write(Buffer.concat([header, buf])); } catch {}
            }
            send(value) {
              if (typeof value === "string") this._send(0x1, value);
              else this._send(0x2, value);
            }
            close(code = 1000, reason = "") {
              if (this.readyState === 3) return;
              this.readyState = 3;
              try {
                const body = Buffer.allocUnsafe(2);
                body.writeUInt16BE(code & 0xffff, 0);
                this._send(0x8, Buffer.concat([body, Buffer.from(reason, "utf8")]));
                this.socket.end();
              } catch {}
            }
          }

          class Room {
            constructor(code, service) {
              this.code = code;
              this.service = service;
              this.record = null;
              this.sockets = new Map();
              this._alarm = null;
            }
            attachment(ws) {
              return this.sockets.get(ws) || { role: "pending", lastSeq: -1 };
            }
            setAttachment(ws, att) { this.sockets.set(ws, att); }
            find(role, slot = null) {
              for (const [ws, item] of this.sockets) {
                if (item.role === role && (slot == null || item.slot === slot)) return ws;
              }
              return null;
            }
            send(ws, value, droppable = false) {
              if (!ws || ws.readyState !== 1) return;
              if (ws.bufferedAmount > MAX_BUFFERED_BYTES) {
                if (!droppable) try { ws.close(1013, "slow-client"); } catch {}
                return;
              }
              try { ws.send(value); } catch {}
            }
            sendJson(ws, value) { this.send(ws, JSON.stringify(value)); }
            broadcast(value, predicate = () => true) {
              const text = JSON.stringify(value);
              for (const [ws, item] of this.sockets) {
                if (item.role === "pending" || item.role === "rejected") continue;
                if (predicate(ws, item)) this.send(ws, text);
              }
            }
            roster() {
              const pads = [];
              for (const [ws, item] of this.sockets) {
                if (item.role === "pad") pads.push({ slot: item.slot });
              }
              pads.sort((a, b) => a.slot - b.slot);
              return { host: !!this.find("host"), screen: !!this.find("screen"), pads };
            }
            pushRoster() { this.broadcast({ t: "roster", roster: this.roster() }); }
            replace(role, slot, current) {
              const old = this.find(role, slot);
              if (old && old !== current) try { old.close(4000, "replaced"); } catch {}
            }
            async acceptHello(ws, room, msg) {
              const role = msg.role;
              const supplied = String(msg.token || "");
              const now = Date.now();
              if (role === "host") {
                if (!supplied || supplied !== room.hostToken) return { error: "host-token" };
                room.hostReservedUntil = 0;
                room.expiresAt = Math.max(room.expiresAt || 0, now + ONLINE_ROOM_TTL_MS);
                this.replace("host", null, ws);
                return { attachment: { role: "host", token: supplied, lastSeq: -1 }, token: supplied };
              }
              if (role === "screen") {
                const old = this.find("screen");
                if (old && (!supplied || supplied !== room.screenToken)) return { error: "screen-full" };
                if (!old && room.screenToken && now < room.screenReservedUntil && supplied !== room.screenToken) return { error: "screen-reserved" };
                const nextToken = supplied && supplied === room.screenToken ? supplied : randomToken();
                room.screenToken = nextToken;
                room.screenReservedUntil = 0;
                this.replace("screen", null, ws);
                return { attachment: { role: "screen", token: nextToken, lastSeq: -1 }, token: nextToken };
              }
              if (role === "pad" && room.config.mode === "controllers") {
                let slot = Number(msg.slot);
                if (slot !== 0 && slot !== 1) slot = this.find("pad", 0) ? 1 : 0;
                const old = this.find("pad", slot);
                const stored = room.padTokens[slot];
                const invited = String(msg.invite || "") === room.padInviteTokens[slot];
                if (old && (!supplied || supplied !== stored)) return { error: "slot-full" };
                if (!old && stored && now < room.padReservedUntil[slot] && supplied !== stored) return { error: "slot-reserved" };
                if ((!supplied || supplied !== stored) && !invited) return { error: "slot-invite" };
                const nextToken = supplied && supplied === stored ? supplied : randomToken();
                room.padTokens[slot] = nextToken;
                room.padReservedUntil[slot] = 0;
                this.replace("pad", slot, ws);
                return { attachment: { role: "pad", slot, token: nextToken, lastSeq: -1 }, token: nextToken, slot };
              }
              return { error: "role" };
            }
            async onMessage(ws, message) {
              const attachment = this.attachment(ws);
              const now = Date.now();
              if (!attachment.rateAt || now - attachment.rateAt >= 1000) { attachment.rateAt = now; attachment.rateCount = 0; }
              attachment.rateCount = (attachment.rateCount || 0) + 1;
              if (attachment.rateCount > MAX_MESSAGES_PER_SECOND) { ws.close(4008, "rate-limit"); return; }
              if (typeof message !== "string") {
                if (attachment.role !== "host") return;
                if (message.byteLength > MAX_FRAME_BYTES) { ws.close(1009, "frame-too-large"); return; }
                for (const [target, item] of this.sockets) {
                  if (item.role === "screen") this.send(target, message, true);
                }
                return;
              }
              if (message.length > MAX_JSON_BYTES) { ws.close(1009, "message-too-large"); return; }
              let msg;
              try { msg = JSON.parse(message); } catch { return; }
              const room = this.record;
              if (!room) { ws.close(4004, "room-expired"); return; }
              if (attachment.role === "pending") {
                if (msg.t !== "hello") { ws.close(4001, "hello-required"); return; }
                const accepted = await this.acceptHello(ws, room, msg);
                if (accepted.error) {
                  this.sendJson(ws, { t: "joinErr", reason: accepted.error });
                  ws.close(4003, accepted.error);
                  return;
                }
                this.setAttachment(ws, { ...accepted.attachment, rateAt: attachment.rateAt, rateCount: attachment.rateCount });
                this.scheduleAlarm();
                this.sendJson(ws, {
                  t: accepted.attachment.role === "host" ? "hosted" : "joined",
                  room: room.code,
                  role: accepted.attachment.role,
                  slot: accepted.slot,
                  token: accepted.token,
                  padInvites: accepted.attachment.role === "host"
                    ? room.padInviteTokens
                    : accepted.attachment.role === "screen" && room.config.mode === "controllers"
                      ? [null, room.padInviteTokens[1]]
                      : undefined,
                  config: room.config,
                  started: room.started,
                  roster: this.roster(),
                });
                this.pushRoster();
                return;
              }
              if (msg.t === "input" && (attachment.role === "screen" || attachment.role === "pad")) {
                if (attachment.role === "screen" && room.config.mode !== "direct") return;
                const seq = Number(msg.seq) || 0;
                if (seq <= attachment.lastSeq) return;
                attachment.lastSeq = seq;
                const slot = attachment.role === "screen" ? 1 : attachment.slot;
                this.sendJson(this.find("host"), { t: "input", slot, seq, d: sanitizeOnlineInput(msg.d) });
                return;
              }
              if (msg.t === "rematchRequest" && attachment.role === "screen") {
                this.sendJson(this.find("host"), { t: "rematchRequest" });
                return;
              }
              if (attachment.role !== "host") return;
              if (msg.t === "start") {
                if (!canStartOnlineRoom(room.config, this.roster())) { this.sendJson(ws, { t: "startErr", reason: "not-ready" }); return; }
                room.started = true;
                this.broadcast({ t: "start", config: room.config });
                return;
              }
              if (["event", "stats", "ended", "rematch", "stream"].includes(msg.t)) {
                if (msg.t === "ended") room.started = false;
                if (msg.t === "rematch") room.started = true;
                this.broadcast(msg, (target) => target !== ws);
              }
            }
            onClose(ws) {
              const item = this.attachment(ws);
              const room = this.record;
              if (!room) return;
              const now = Date.now();
              if (item.role === "host") {
                const anotherHost = [...this.sockets.keys()].some((t) => t !== ws && this.attachment(t).role === "host");
                if (!anotherHost) room.hostReservedUntil = now + ONLINE_RECONNECT_GRACE_MS;
              }
              if (item.role === "screen") room.screenReservedUntil = now + ONLINE_RECONNECT_GRACE_MS;
              if (item.role === "pad") room.padReservedUntil[item.slot] = now + ONLINE_RECONNECT_GRACE_MS;
              this.sockets.delete(ws);
              this.scheduleAlarm();
              if (this.sockets.size > 0) this.pushRoster();
            }
            createRoom(body) {
              if (this.record) return 409;
              const now = Date.now();
              this.record = {
                code: body.room,
                hostToken: body.hostToken,
                config: normalizeOnlineConfig(body.config),
                createdAt: now,
                expiresAt: now + ONLINE_ROOM_TTL_MS,
                started: false,
                hostReservedUntil: 0,
                screenToken: null,
                screenReservedUntil: 0,
                padInviteTokens: body.padInvites,
                padTokens: [null, null],
                padReservedUntil: [0, 0],
              };
              this.scheduleAlarm();
              return 201;
            }
            addSocket(ws) {
              const room = this.record;
              if (!room) {
                ws.send(JSON.stringify({ t: "joinErr", reason: "no-room" }));
                ws.close(4004, "no-room");
                return;
              }
              if (this.sockets.size >= MAX_ROOM_SOCKETS) {
                ws.send(JSON.stringify({ t: "joinErr", reason: "room-busy" }));
                ws.close(4008, "room-busy");
                return;
              }
              this.sockets.set(ws, { role: "pending", connectedAt: Date.now(), lastSeq: -1 });
              ws.onmessage = (data) => this.onMessage(ws, data);
              ws.onclose = () => this.onClose(ws);
              setTimeout(() => {
                if (this.attachment(ws).role === "pending") { try { ws.close(4001, "hello-timeout"); } catch {} }
              }, 10_000);
            }
            scheduleAlarm() {
              if (this._alarm) { clearTimeout(this._alarm); this._alarm = null; }
              const room = this.record;
              if (!room) return;
              const expiresAt = room.expiresAt || room.createdAt + ONLINE_ROOM_TTL_MS;
              const deadlines = [expiresAt];
              if (room.hostReservedUntil) deadlines.push(room.hostReservedUntil);
              if (room.screenReservedUntil) deadlines.push(room.screenReservedUntil);
              for (const d of room.padReservedUntil) if (d) deadlines.push(d);
              const wait = Math.min(...deadlines) - Date.now();
              this._alarm = setTimeout(() => this.alarm(), Math.max(1000, wait));
            }
            alarm() {
              const room = this.record;
              if (!room) return;
              const now = Date.now();
              const expiresAt = room.expiresAt || room.createdAt + ONLINE_ROOM_TTL_MS;
              let reason = "";
              if (room.hostReservedUntil && now >= room.hostReservedUntil) {
                if (!this.find("host")) reason = "host-left";
                else room.hostReservedUntil = 0;
              }
              if (!reason && now >= expiresAt) reason = "room-expired";
              if (reason) {
                this.broadcast({ t: "closed", reason });
                for (const ws of [...this.sockets.keys()]) try { ws.close(4004, reason); } catch {}
                this.record = null;
                this.service.rooms.delete(this.code);
                return;
              }
              this.scheduleAlarm();
            }
          }

          class OnlineService {
            constructor() {
              this.rooms = new Map();
              this.server = http.createServer((req, res) => this._handleHttp(req, res));
              this.server.on("upgrade", (req, socket, head) => this._handleUpgrade(req, socket, head));
            }
            listen() {
              this.server.listen(PORT, () => console.log(`[online] room service listening on :${PORT} (http /create + ws /connect)`));
            }
            _sendJson(res, out) {
              res.writeHead(out.status, out.headers);
              res.end(out.body);
            }
            async _readSmallJson(req) {
              const chunks = [];
              let size = 0;
              for await (const c of req) { size += c.length; if (size > MAX_JSON_BYTES) throw new Error("body-too-large"); chunks.push(c); }
              const text = Buffer.concat(chunks).toString("utf8");
              if (text.length > MAX_JSON_BYTES) throw new Error("body-too-large");
              return JSON.parse(text || "{}");
            }
            async _handleHttp(req, res) {
              const url = new URL(req.url, `http://${req.headers.host}`);
              const origin = req.headers.origin || "*";
              const reply = (out) => this._sendJson(res, out);
              if (req.method === "GET" && url.pathname === "/health") return reply(json({ ok: true }, 200, origin));
              if (!originAllowed(origin)) return reply(json({ ok: false, reason: "origin" }, 403, origin));
              if (req.method === "OPTIONS") { res.writeHead(204, cors(origin)); return res.end(); }
              if (req.method === "POST" && url.pathname === "/create") {
                let body;
                try { body = await this._readSmallJson(req); } catch (e) {
                  return reply(json({ ok: false, reason: e.message || "bad-json" }, 400, origin));
                }
                const config = normalizeOnlineConfig(body && body.config);
                for (let attempt = 0; attempt < 8; attempt++) {
                  const room = randomCode();
                  const hostToken = randomToken();
                  const padInvites = [randomToken(), randomToken()];
                  const r = new Room(room, this);
                  const status = r.createRoom({ room, hostToken, padInvites, config });
                  if (status === 201) {
                    this.rooms.set(room, r);
                    return reply(json({ ok: true, room, hostToken, padInvites, config }, 201, origin));
                  }
                }
                return reply(json({ ok: false, reason: "create-collision" }, 503, origin));
              }
              if (req.method === "GET" && url.pathname === "/connect") {
                return reply(json({ ok: false, reason: "upgrade-required" }, 426, origin));
              }
              return reply(json({ ok: false, reason: "not-found" }, 404, origin));
            }
            _handleUpgrade(req, socket, head) {
              const url = new URL(req.url, `http://${req.headers.host}`);
              const origin = req.headers.origin || "*";
              const fail = (code, reason) => {
                try { socket.write(`HTTP/1.1 ${code} ${reason}\r\n\r\n`); socket.destroy(); } catch {}
              };
              if (url.pathname !== "/connect") return fail(404, "not-found");
              if (!originAllowed(origin)) return fail(403, "origin");
              const room = normalizeRoomCode(url.searchParams.get("room"));
              if (room.length !== ONLINE_ROOM_CODE_LENGTH) return fail(400, "room");
              const r = this.rooms.get(room);
              if (!r) { fail(400, "no-room"); return; }
              acceptWebSocket(req, socket, head, (ws) => r.addSocket(ws), (ws) => r.onClose(ws));
            }
          }

          const service = new OnlineService();
          service.listen();
          SERVEREOS

          echo "=== 已生成构建文件 ==="
          ls -la build-context/Dockerfile build-context/.dockerignore build-context/docker/start.mjs build-context/online/server.mjs build-context/online/shared.js

      # 设置 QEMU (跨架构构建)
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      # 设置 Docker Buildx
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 Docker Hub (固定推送目标之一)
      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 登录到 GitHub Container Registry (固定推送目标之二)
      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 读取 package.json version (供 version 标签使用)
      - name: 读取版本号
        id: version
        run: |
          VERSION=$(node -p "require('./build-context/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package.json version = $VERSION"

      # 计算小写命名空间 (Docker/OCI 要求仓库名全小写, 而 github.repository_owner 保留原始大小写)
      - name: 计算小写命名空间
        id: names
        run: |
          echo "gh_owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "dh_owner=$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # 10a. 构建并推送 Docker Hub (主推送, 必须成功)
      - name: 构建并推送 Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: build-context
          file: build-context/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          # 关闭 build provenance/attestation: 多平台镜像会额外推送 attestation
          # manifest, 短时间内大量请求易触发注册表二级速率限制
          provenance: false
          # 固定推送 Docker Hub, 标签: latest / <package.json version>
          # 注意: 命名空间必须全小写 (OCI 规范), 故用 steps.names.outputs 的小写值
          tags: |
            ${{ steps.names.outputs.dh_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.names.outputs.dh_owner }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          build-args: |
            SKIP_SW_STAMP=false

      # 10b. 推送 GHCR (与 Docker Hub 分两次调用, 降低单 registry 瞬时请求量;
      #   限流时不影响 Docker Hub 已成功的镜像。失败不阻断 job, 限流窗口过后再重跑即可)
      - name: 推送 GHCR (带重试, 失败不报错)
        continue-on-error: true
        run: |
          set +e
          ok=0
          for i in 1 2 3 4 5; do
            echo "=== GHCR 推送尝试 $i/5 ==="
            if docker buildx build \
              --platform "${{ env.PLATFORMS }}" \
              --tag ghcr.io/${{ steps.names.outputs.gh_owner }}/${{ env.IMAGE_NAME }}:latest \
              --tag ghcr.io/${{ steps.names.outputs.gh_owner }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
              --push \
              build-context; then
              echo "✔ GHCR 推送成功"
              ok=1
              break
            fi
            if [ "$i" -lt 5 ]; then
              WAIT=$((i * 60))
              echo "⚠ GHCR 推送受限, 等待 ${WAIT}s 后重试..."
              sleep "$WAIT"
            else
              echo "✖ GHCR 推送失败 (已重试 5 次), 不阻断 Docker Hub 镜像"
            fi
          done
          # 无论成功失败均以 0 退出, 确保该步骤绝不报错
          exit 0

      # 11. 汇总
      - name: 构建摘要
        run: |
          echo "### 构建完成 🎉" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "源仓库: \`${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "镜像: \`${{ steps.names.outputs.dh_owner }}/${{ env.IMAGE_NAME }}\` 与 \`ghcr.io/${{ steps.names.outputs.gh_owner }}/${{ env.IMAGE_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "平台: \`${{ env.PLATFORMS }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "标签:" >> "$GITHUB_STEP_SUMMARY"
          echo "- :latest / :${{ steps.version.outputs.version }} (Docker Hub + GHCR)" >> "$GITHUB_STEP_SUMMARY"
